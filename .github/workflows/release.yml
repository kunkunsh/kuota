# Kuota Desktop Release Pipeline: Tag push ('app-v*') -> Gate verification -> Multi-runner release
#
# Release trigger: `git tag app-v0.1.0 && git push origin app-v0.1.0`
# Modeled after refyard & space-lens release orchestrations:
# 1. Gate verification job verifies TypeScript typecheck, tests, and Rust commands before building.
# 2. Matrix runners build universal desktop bundles for macOS (ARM64 + x86_64), Linux, and Windows.
# 3. tauri-action compiles, bundles (dmg, deb, AppImage, nsis/msi), and produces updater artifacts with minisign.
name: Release Desktop App

on:
  push:
    tags:
      - "app-v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  gate:
    name: Verification Gate
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting and lints
        run: bun run check

      - name: Typecheck
        run: bun run typecheck

      - name: Run unit & integration test suites
        run: bun run test

      - name: Run Rust desktop command tests
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml

  build:
    name: Desktop Bundle (${{ matrix.platform }})
    needs: gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            targets: aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
            targets: x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ""
            targets: ""
          - platform: windows-latest
            args: ""
            targets: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: ${{ contains(matrix.platform, 'ubuntu') }}
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Compile Web UI SPA into desktop dist
        run: bun --cwd packages/kunkun build:web

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop/src-tauri
          tagName: app-v__VERSION__
          releaseName: "Kuota Desktop v__VERSION__"
          releaseBody: "See assets below to install Kuota Desktop for your platform. Kuota monitors AI quotas locally and supports automatic updates."
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
